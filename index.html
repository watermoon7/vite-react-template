<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Kanban</title>
		<!-- Applies a forced theme and the last used style before first paint, so overriding
		     the system setting does not flash the wrong colours and the glass style does not
		     flash the classic one. The keys must match CLIENT.storageKeys.theme and .style in
		     app.config.ts, and the style fallback (a first visit lands on the sign-in page)
		     must match LOGIN_STYLE there. "system" needs nothing here: it is a pure CSS media query. -->
		<script>
			try {
				var t = localStorage.getItem("kanban:theme");
				if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
				document.documentElement.dataset.style = localStorage.getItem("kanban:style") || "glass";
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
